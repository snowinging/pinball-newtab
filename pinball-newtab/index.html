<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠新标签页</title>
<!-- CodeMirror -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
<!-- Feather Icons -->
<script src="https://unpkg.com/feather-icons"></script>
<!-- xterm.js (终端) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0c29;
    user-select: none;
  }
  #main-frame { width: 100%; height: 100%; border: none; display: block; }

  /* 页面包装：用于消散时的展开动画 */
  #page-wrapper {
    position: fixed; inset: 0; z-index: 1;
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #page-wrapper.collapsed {
    clip-path: circle(0% at 50% 50%);
  }

  /* ===== 入场动画 ===== */
  @keyframes bubbleIn {
    0%   { opacity: 0; transform: scale(0.3); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ===== 气泡通用 ===== */
  .bubble {
    position: fixed; z-index: 250;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.5px solid rgba(203, 166, 247, 0.35);
    background: rgba(30, 30, 46, 0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #cba6f7; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transition: box-shadow 0.3s, transform 0.2s, width 0.3s, height 0.3s, border-radius 0.3s;
    display: flex; align-items: center; justify-content: center;
    animation: bubbleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .bubble:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 24px rgba(203,166,247,0.2), 0 0 0 3px rgba(203,166,247,0.06);
  }
  .bubble .bub-icon { pointer-events: none; display: flex; align-items: center; }
  .bubble .bub-icon .feather { width: 20px; height: 20px; stroke-width: 1.8; }
  .bubble .bub-tip {
    position: absolute; pointer-events: none;
    white-space: nowrap; padding: 3px 9px; font-size: 11px;
    background: rgba(24,24,37,0.92); color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 6px;
    opacity: 0; transition: opacity 0.2s;
    right: 50px; font-family: inherit;
  }
  .bubble:hover .bub-tip { opacity: 1; }
  /* 气泡激活状态（编辑器打开时） */
  .bubble.active {
    width: 36px; height: 36px;
    background: rgba(243, 139, 168, 0.85);
    border-color: rgba(243, 139, 168, 0.5);
    color: #1e1e2e;
    box-shadow: 0 4px 20px rgba(243,139,168,0.3);
  }
  .bubble.active:hover { transform: scale(1.1) rotate(90deg); }

  /* ===== 遮罩 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px); z-index: 300;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  /* ===== 浮窗通用 ===== */
  .float-win {
    position: fixed; z-index: 400;
    background: #1e1e2e; border-radius: 14px;
    border: 1px solid #45475a;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; pointer-events: none;
    transform: scale(0.92);
    transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 340px; min-height: 220px;
    resize: both;
  }
  .float-win.active { opacity: 1; pointer-events: auto; transform: scale(1); }
  .float-win .f-hdr {
    display: flex; align-items: center; padding: 9px 14px;
    background: #181825; border-bottom: 1px solid #313244;
    cursor: grab; flex-shrink: 0;
  }
  .float-win .f-hdr.dragging { cursor: grabbing; }
  .float-win .f-hdr .f-ttl {
    font-size: 13px; font-weight: 600; color: #cba6f7;
    flex: 1; display: flex; align-items: center; gap: 7px;
  }
  .float-win .f-hdr .f-ttl .feather { width: 16px; height: 16px; }
  .float-win .f-hdr .f-st {
    font-size: 11px; color: #6c7086; margin-right: 10px;
  }
  .float-win .f-hdr .f-close {
    width: 28px; height: 28px; border: none; background: transparent;
    color: #6c7086; font-size: 15px; cursor: pointer; border-radius: 6px;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .float-win .f-hdr .f-close:hover { background: #f38ba8; color: #1e1e2e; }

  /* ===== 编辑器浮窗 ===== */
  #float-editor { width: 680px; height: 480px; }
  #float-editor .CodeMirror {
    flex: 1; height: auto !important;
    font-size: 13px; line-height: 1.6;
  }
  #float-editor .CodeMirror-gutters { background: #181825 !important; border-right: 1px solid #313244 !important; }
  .float-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .float-ftr {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; background: #181825;
    border-top: 1px solid #313244; flex-shrink: 0;
  }
  .float-ftr button {
    padding: 5px 12px; border: 1px solid #45475a; border-radius: 6px;
    background: #313244; color: #cdd6f4; font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .float-ftr button:hover { background: #45475a; border-color: #585b70; }
  .float-ftr button.primary { background: #cba6f7; color: #1e1e2e; border-color: #cba6f7; font-weight: 600; }
  .float-ftr button.primary:hover { background: #b4befe; border-color: #b4befe; }
  .float-ftr .f-hint { font-size: 11px; color: #585b70; margin-left: auto; }
  .float-ftr .f-hint kbd {
    display: inline-block; padding: 1px 5px; background: #313244;
    border-radius: 3px; font-size: 10px; border: 1px solid #45475a; font-family: inherit;
  }

  /* ===== 终端浮窗 ===== */
  #float-terminal { width: 680px; height: 400px; }
  #terminal-container { flex: 1; background: #1a1a2e; padding: 4px; overflow: hidden; }
  #terminal-connect-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; background: #11111b; border-bottom: 1px solid #313244; flex-shrink: 0;
  }
  #terminal-connect-bar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f38ba8; flex-shrink: 0;
  }
  #terminal-connect-bar .dot.connected { background: #a6e3a1; }
  #terminal-connect-bar span { font-size: 12px; color: #6c7086; }
  #terminal-connect-bar button {
    margin-left: auto; padding: 4px 12px; font-size: 11px;
    border: 1px solid #45475a; border-radius: 5px;
    background: #313244; color: #cdd6f4; cursor: pointer; font-family: inherit;
  }
  #terminal-connect-bar button:hover { background: #45475a; }

  /* ===== 链接管理浮窗 ===== */
  #float-links { width: 500px; height: 420px; }
  .links-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 12px 14px; gap: 8px; }
  .links-body .link-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: rgba(255,255,255,0.04);
    border: 1px solid #313244; border-radius: 8px;
    transition: background 0.2s;
  }
  .links-body .link-item:hover { background: rgba(255,255,255,0.07); }
  .links-body .link-item .li-icon {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: #cba6f7; flex-shrink: 0;
  }
  .links-body .link-item .li-icon .feather { width: 20px; height: 20px; }
  .links-body .link-item .li-name {
    flex: 1; font-size: 13px; color: #cdd6f4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .links-body .link-item .li-url {
    font-size: 11px; color: #6c7086; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .links-body .link-item .li-del {
    width: 26px; height: 26px; border: none; background: transparent;
    color: #6c7086; cursor: pointer; border-radius: 5px; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .links-body .link-item .li-del:hover { background: rgba(243,139,168,0.2); color: #f38ba8; }
  .links-body .link-item .li-edit {
    width: 26px; height: 26px; border: none; background: transparent;
    color: #6c7086; cursor: pointer; border-radius: 5px; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .links-body .link-item .li-edit:hover { background: rgba(203,166,247,0.2); color: #cba6f7; }
  .links-body .link-item .li-move {
    width: 22px; height: 22px; border: none; background: transparent;
    color: #585b70; cursor: pointer; border-radius: 4px; font-size: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.5;
  }
  .links-body .link-item:hover .li-move { opacity: 1; }
  .links-body .link-item .li-move:hover { background: rgba(203,166,247,0.15); color: #cba6f7; opacity: 1; }

  /* ===== 图标选择器 ===== */
  .lk-icon-picker {
    position: absolute; inset: 0; z-index: 50;
    background: rgba(30,30,46,0.97); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 0 0 14px 14px; animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
  .lk-icon-picker .lk-ip-header {
    display: flex; gap: 6px; padding: 10px 12px;
    border-bottom: 1px solid #313244; flex-shrink: 0;
  }
  .lk-icon-picker .lk-ip-header input {
    flex: 1; padding: 6px 10px; border: 1px solid #45475a; border-radius: 6px;
    background: rgba(255,255,255,0.05); color: #cdd6f4; font-size: 12px; outline: none;
    font-family: inherit;
  }
  .lk-icon-picker .lk-ip-header input:focus { border-color: #cba6f7; }
  .lk-icon-picker .lk-ip-header input::placeholder { color: #585b70; }
  .lk-icon-picker .lk-ip-header button {
    padding: 4px 10px; border: 1px solid #45475a; border-radius: 6px;
    background: #313244; color: #cdd6f4; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .lk-icon-picker .lk-ip-header button:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
  .lk-ip-grid {
    flex: 1; overflow-y: auto; padding: 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 4px; align-content: start;
  }
  .lk-ip-grid::-webkit-scrollbar { width: 4px; }
  .lk-ip-grid::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  .lk-ip-grid .ip-item {
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #a6adc8; transition: all 0.15s;
    border: 1px solid transparent;
  }
  .lk-ip-grid .ip-item:hover { background: rgba(255,255,255,0.08); color: #cdd6f4; }
  .lk-ip-grid .ip-item.selected { background: rgba(203,166,247,0.2); color: #cba6f7; border-color: #cba6f7; }
  .lk-ip-grid .ip-item .feather { width: 18px; height: 18px; stroke-width: 1.5; }
  .links-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .links-list::-webkit-scrollbar { width: 4px; }
  .links-list::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  .links-ftr {
    display: flex; gap: 6px; padding: 8px 0 0; border-top: 1px solid #313244; margin-top: 4px;
  }
  .links-ftr input {
    flex: 1; padding: 7px 10px; border: 1px solid #45475a; border-radius: 6px;
    background: rgba(255,255,255,0.05); color: #cdd6f4; font-size: 12px; outline: none; font-family: inherit;
  }
  .links-ftr input::placeholder { color: #585b70; }
  .links-ftr input:focus { border-color: #cba6f7; }
  .links-ftr button {
    padding: 7px 14px; border: 1px solid #45475a; border-radius: 6px;
    background: #cba6f7; color: #1e1e2e; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .links-ftr button:hover { background: #b4befe; }
  .links-empty {
    text-align: center; padding: 30px 0; color: #585b70; font-size: 13px;
  }
  .links-empty .feather { width: 32px; height: 32px; margin-bottom: 8px; }

  /* ===== 响应式 ===== */
  @media (max-width: 720px) {
    #float-editor { width: 94vw !important; height: 70vh !important; left: 3vw !important; }
    #float-terminal { width: 94vw !important; height: 60vh !important; left: 3vw !important; }
    #float-links { width: 94vw !important; left: 3vw !important; }
    #float-notes { width: 94vw !important; left: 3vw !important; height: 70vh !important; }
    #float-music { width: 94vw !important; left: 3vw !important; height: 70vh !important; }
  }

  /* ===== 小纸条浮窗 ===== */
  #float-notes { width: 620px; height: 420px; }
  #float-notes textarea::-webkit-scrollbar { width: 4px; }
  #float-notes textarea::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  #nt-list::-webkit-scrollbar { width: 4px; }
  #nt-list::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  .nt-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: #a6adc8; transition: all 0.15s;
    margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nt-item:hover { background: rgba(255,255,255,0.06); color: #cdd6f4; }
  .nt-item.active { background: rgba(203,166,247,0.15); color: #cba6f7; font-weight: 500; }
  .nt-item .nt-del {
    float: right; opacity: 0; transition: opacity 0.15s;
    width: 18px; height: 18px; border: none; background: transparent;
    color: #f38ba8; cursor: pointer; border-radius: 3px; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .nt-item:hover .nt-del { opacity: 1; }
  .nt-item .nt-del:hover { background: rgba(243,139,168,0.2); }

  /* ===== 音乐播放器浮窗 ===== */
  #float-music { width: 500px; height: 380px; }
  #float-music .music-body {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 12px 14px;
  }
  #float-music .music-now {
    text-align: center; padding: 16px 0 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #float-music .music-now .mn-title {
    font-size: 16px; font-weight: 500; color: #cdd6f4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #float-music .music-now .mn-artist {
    font-size: 12px; color: #6c7086; margin-top: 4px;
  }
  #float-music .music-progress {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
  }
  #float-music .music-progress input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px;
    background: #313244; outline: none;
  }
  #float-music .music-progress input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #cba6f7; cursor: pointer;
  }
  #float-music .music-progress .mp-time {
    font-size: 11px; color: #6c7086; min-width: 40px; text-align: center;
  }
  #float-music .music-controls {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 8px 0 12px;
  }
  /* 播放控制按钮（圆形） */
  #float-music .music-controls button.mc-ctrl {
    width: 36px; height: 36px; border: 1px solid #45475a;
    border-radius: 50%; background: #313244; color: #cdd6f4;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  #float-music .music-controls button.mc-ctrl:hover { background: #45475a; border-color: #cba6f7; }
  #float-music .music-controls button.mc-play {
    width: 44px; height: 44px; background: #cba6f7; color: #1e1e2e; border-color: #cba6f7;
  }
  #float-music .music-controls button.mc-play:hover { background: #b4befe; }
  /* 模式/静音按钮（扁平文字） */
  #float-music .music-controls .mc-flat {
    background: transparent; border: none; color: #a6adc8;
    font-size: 13px; cursor: pointer; transition: all 0.15s;
    padding: 4px 8px; border-radius: 6px; font-family: inherit;
    display: flex; align-items: center; gap: 4px;
  }
  #float-music .music-controls .mc-flat:hover { background: rgba(255,255,255,0.06); color: #cdd6f4; }
  #float-music .music-controls .mc-flat:active { background: rgba(203,166,247,0.15); color: #cba6f7; transform: scale(0.95); }
  #float-music .music-controls .mc-flat .mc-label { font-size: 11px; }
  #float-music .music-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px;
    border-radius: 50%; background: #cba6f7; cursor: pointer;
  }
  #float-music .music-list {
    flex: 1; overflow-y: auto; margin-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.06); padding-top: 6px;
  }
  #float-music .music-list::-webkit-scrollbar { width: 4px; }
  #float-music .music-list::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  .music-list .ml-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: #a6adc8; transition: all 0.15s;
  }
  .music-list .ml-item:hover { background: rgba(255,255,255,0.06); }
  .music-list .ml-item.active { background: rgba(203,166,247,0.12); color: #cba6f7; }
  .music-list .ml-item .ml-index { width: 20px; text-align: center; color: #585b70; font-size: 11px; }
  .music-list .ml-item .ml-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music-list .ml-item .ml-del {
    width: 22px; height: 22px; border: none; background: transparent;
    color: #6c7086; cursor: pointer; border-radius: 4px; font-size: 12px;
    display: flex; align-items: center; justify-content: center; opacity: 0;
  }
  .music-list .ml-item:hover .ml-del { opacity: 1; }
  .music-list .ml-item .ml-del:hover { background: rgba(243,139,168,0.2); color: #f38ba8; }
  .music-add {
    display: flex; gap: 6px; padding: 8px 0 0;
    border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px;
  }
  .music-add input {
    flex: 1; padding: 6px 10px; border: 1px solid #45475a; border-radius: 6px;
    background: rgba(255,255,255,0.05); color: #cdd6f4; font-size: 12px;
    outline: none; font-family: inherit;
  }
  .music-add input::placeholder { color: #585b70; }
  .music-add input:focus { border-color: #cba6f7; }
  .music-add button {
    padding: 6px 14px; border: 1px solid #cba6f7; border-radius: 6px;
    background: #cba6f7; color: #1e1e2e; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .music-add button:hover { background: #b4befe; }

  /* ===== Pinball按钮 ===== */
  #pinball-btn {
    position: fixed; z-index: 260;
    bottom: 24px; left: 24px;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px 8px 12px;
    border: 1px solid rgba(203, 166, 247, 0.25);
    border-radius: 24px;
    background: rgba(30, 30, 46, 0.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #cba6f7; cursor: pointer;
    font-size: 13px; font-family: inherit;
    transition: all 0.3s; user-select: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: bubbleIn 0.6s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  #pinball-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 24px rgba(203,166,247,0.2);
    border-color: rgba(203, 166, 247, 0.5);
    background: rgba(30, 30, 46, 0.8);
  }
  #pinball-btn:active { transform: scale(0.95); }
  #pinball-btn .pb-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #cba6f7, #f5c2e7);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    transition: transform 0.3s;
  }
  #pinball-btn:hover .pb-icon { transform: rotate(360deg); }
  #pinball-btn .pb-label { font-weight: 500; white-space: nowrap; }
  /* 弹射中状态 */
  #pinball-btn.launching {
    opacity: 0.6;
    animation: pulse 0.6s infinite alternate;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(203,166,247,0); }
    100% { box-shadow: 0 0 30px 8px rgba(203,166,247,0.15); }
  }
  /* 弹射轨迹（气泡上的临时特效） */
  .bubble.pinballing {
    transition: none !important;
    box-shadow: 0 0 20px rgba(203,166,247,0.3), 0 0 60px rgba(203,166,247,0.1) !important;
  }

  /* ===== 音乐呼吸灯 ===== */
  @keyframes musicBreathe {
    0%   { box-shadow: 0 0 12px rgba(0,255,255,0.25), 0 0 30px rgba(0,255,255,0.1), 0 0 60px rgba(0,255,255,0.05); transform: scale(1); }
    100% { box-shadow: 0 0 22px rgba(0,255,255,0.55), 0 0 45px rgba(0,255,255,0.25), 0 0 90px rgba(0,255,255,0.12); transform: scale(1.06); }
  }
  .bubble.music-playing {
    animation: musicBreathe 1.6s ease-in-out infinite alternate !important;
    border-color: rgba(0,255,255,0.35) !important;
    transition: box-shadow 0.4s, border-color 0.4s, transform 0.4s !important;
  }
  .bubble.pinballing.music-playing {
    box-shadow: none !important;
    animation: musicBreathe 1.3s ease-in-out infinite alternate !important;
    border-color: rgba(0,255,255,0.5) !important;
  }

  /* ===== 终端绿色呼吸灯 ===== */
  @keyframes termBreathe {
    0%   { box-shadow: 0 0 10px rgba(0,255,100,0.2), 0 0 25px rgba(0,255,100,0.08), 0 0 50px rgba(0,255,100,0.03); transform: scale(1); }
    100% { box-shadow: 0 0 20px rgba(0,255,100,0.5), 0 0 40px rgba(0,255,100,0.2), 0 0 80px rgba(0,255,100,0.1); transform: scale(1.05); }
  }
  .bubble.term-connected {
    animation: termBreathe 1.5s ease-in-out infinite alternate !important;
    border-color: rgba(0,255,100,0.35) !important;
    transition: box-shadow 0.4s, border-color 0.4s, transform 0.4s !important;
  }
  .bubble.pinballing.term-connected {
    box-shadow: none !important;
    animation: termBreathe 1.2s ease-in-out infinite alternate !important;
    border-color: rgba(0,255,100,0.5) !important;
  }

  /* ===== 粒子尾迹 ===== */
  .pinball-particle {
    position: fixed; z-index: 240; pointer-events: none;
    border-radius: 50%;
    animation: particleFade 0.6s ease-out forwards;
  }
  @keyframes particleFade {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.1) translate(0, -15px); }
  }

  /* ===== 快捷控制小Pinball ===== */
  .mini-ctrl {
    position: fixed; z-index: 500; pointer-events: auto;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid rgba(0,255,255,0.3);
    background: rgba(30,30,46,0.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #7fdfd0; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    animation: miniIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .mini-ctrl:hover { box-shadow: 0 6px 24px rgba(0,255,255,0.3); }
  .mini-ctrl:active { transform: scale(0.93); }
  .mini-ctrl .feather { width: 18px; height: 18px; stroke-width: 1.8; }
  @keyframes miniIn {
    0%   { opacity: 0; transform: scale(0.3); }
    100% { opacity: 1; transform: scale(1); }
  }
  .mini-ctrl.fade-out { animation: miniOut 0.2s ease-in forwards; }
  @keyframes miniOut {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.3); }
  }

  /* ===== 转场遮罩 ===== */
  #transition-overlay {
    position: fixed; z-index: 200;
    inset: 0; pointer-events: none;
    background: #0f0c29;
    clip-path: circle(0% at 50% 50%);
    transition: clip-path 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #transition-overlay.active {
    pointer-events: auto;
  }
</style>
</head>
<body>

<!-- 主页面 -->
<!-- 主页面包装（用于展开动画） -->
<div id="page-wrapper" style="background:transparent;">
<iframe id="main-frame" style="background:transparent;width:100%;height:100%;border:none;display:block;" sandbox="allow-scripts allow-modals allow-same-origin allow-popups allow-top-navigation allow-forms"></iframe>
</div>

<!-- 气泡容器 -->
<div id="bubbles-container"></div>

<!-- 遮罩 -->
<div class="overlay" id="overlay"></div>

<!-- ===== 编辑器浮窗 ===== -->
<div class="float-win" id="float-editor">
  <div class="f-hdr" data-drag="editor">
    <span class="f-ttl"><i data-feather="edit-3"></i> 编辑器</span>
    <span class="f-st" id="ed-status">就绪</span>
    <button class="f-close" data-close="editor">X</button>
  </div>
  <div class="float-body">
    <textarea id="code-editor"></textarea>
  </div>
  <div class="float-ftr">
    <button class="primary" id="btn-run">Run</button>
    <button id="btn-save-ed">Save</button>
    <button id="btn-reset">Reset</button>
    <span class="f-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Run · <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</span>
  </div>
</div>

<!-- ===== 终端浮窗 ===== -->
<div class="float-win" id="float-terminal">
  <div class="f-hdr" data-drag="terminal">
    <span class="f-ttl"><i data-feather="terminal"></i> 终端</span>
    <span class="f-st" id="term-status">未连接</span>
    <button class="f-close" data-close="terminal">X</button>
  </div>
  <div id="terminal-connect-bar">
    <span class="dot" id="term-dot"></span>
    <span id="term-label">未连接到终端服务器</span>
    <button id="term-reconnect">重连</button>
  </div>
  <div id="terminal-container"></div>
</div>

<!-- ===== 链接管理浮窗 ===== -->
<div class="float-win" id="float-links">
  <div class="f-hdr" data-drag="links">
    <span class="f-ttl"><i data-feather="link-2"></i> 链接 </span>
    <span class="f-st" id="lk-status">8 个链接</span>
    <button class="f-close" data-close="links">X</button>
  </div>
  <div class="links-body">
    <div class="links-list" id="links-list"></div>
    <!-- 图标选择器 -->
    <div class="lk-icon-picker" id="lk-icon-picker" style="display:none;">
      <div class="lk-ip-header">
        <input type="text" id="lk-ip-search" placeholder="搜索图标…" autofocus>
        <button id="lk-ip-close">X</button>
      </div>
      <div class="lk-ip-grid" id="lk-ip-grid"></div>
    </div>
    <div class="links-ftr">
      <input type="text" id="lk-name" placeholder="名称">
      <input type="text" id="lk-url" placeholder="URL">
      <button id="lk-add">+ 添加</button>
    </div>
  </div>
</div>

<!-- ===== 小纸条浮窗 ===== -->
<div class="float-win" id="float-notes">
  <div class="f-hdr" data-drag="notes">
    <span class="f-ttl"><i data-feather="edit"></i> 便签</span>
    <span class="f-st" id="nt-status">0 条笔记</span>
    <button class="f-close" data-close="notes">X</button>
  </div>
  <div class="float-body" style="flex-direction:row;">
    <div style="width:180px;flex-shrink:0;border-right:1px solid #313244;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:8px;border-bottom:1px solid #313244;flex-shrink:0;">
        <button id="nt-new" style="width:100%;padding:6px;border:1px dashed #45475a;border-radius:6px;background:transparent;color:#a6adc8;font-size:12px;cursor:pointer;font-family:inherit;">+ 新建便签</button>
      </div>
      <div id="nt-list" style="flex:1;overflow-y:auto;padding:4px;"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:8px 12px;border-bottom:1px solid #313244;flex-shrink:0;display:flex;align-items:center;gap:8px;">
        <input id="nt-title" placeholder="Note title…" style="flex:1;padding:5px 8px;border:1px solid #45475a;border-radius:4px;background:rgba(255,255,255,0.05);color:#cdd6f4;font-size:13px;outline:none;font-family:inherit;">
      </div>
      <textarea id="nt-content" placeholder="想写点什么喵～" style="flex:1;padding:12px;border:none;background:transparent;color:#cdd6f4;font-size:13px;resize:none;outline:none;font-family:inherit;line-height:1.7;"></textarea>
      <div style="padding:6px 12px;border-top:1px solid #313244;flex-shrink:0;display:flex;gap:6px;align-items:center;">
        <button id="nt-save" style="padding:4px 12px;border:1px solid #cba6f7;border-radius:5px;background:#cba6f7;color:#1e1e2e;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">Save 保存</button>
        <button id="nt-export" style="padding:4px 12px;border:1px solid #45475a;border-radius:5px;background:#313244;color:#cdd6f4;font-size:11px;cursor:pointer;font-family:inherit;">Import 下载 TXT</button>
        <button id="nt-import" style="padding:4px 12px;border:1px solid #45475a;border-radius:5px;background:#313244;color:#cdd6f4;font-size:11px;cursor:pointer;font-family:inherit;">Export 导入 TXT</button>
        <input type="file" id="nt-file-input" accept=".txt" style="display:none;">
        <span style="margin-left:auto;font-size:11px;color:#585b70;" id="nt-saved">自动保存 v</span>
      </div>
    </div>
  </div>
</div>

<!-- ===== 音乐播放器浮窗 ===== -->
<div class="float-win" id="float-music">
  <div class="f-hdr" data-drag="music">
    <span class="f-ttl"><i data-feather="music"></i> 音乐</span>
    <span class="f-st" id="mc-status">已停止</span>
    <button class="f-close" data-close="music">X</button>
  </div>
  <div class="music-body">
    <div class="music-now">
      <div class="mn-title" id="mc-title">未选择歌曲</div>
      <div class="mn-artist" id="mc-source">粘贴音频链接开始播放</div>
    </div>
    <div class="music-progress">
      <span class="mp-time" id="mc-current">00:00</span>
      <input type="range" id="mc-progress" value="0" max="100">
      <span class="mp-time" id="mc-duration">00:00</span>
    </div>
    <div class="music-controls">
      <button class="mc-ctrl" id="mc-prev" title="上一首">|<<</button>
      <button class="mc-ctrl mc-play" id="mc-play" title="播放/暂停">▶</button>
      <button class="mc-ctrl" id="mc-next" title="下一首">>>|</button>
      <span class="mc-flat" id="mc-mode" title="播放模式" style="cursor:pointer;">→▪ <span class="mc-label">顺序</span></span>
      <input type="range" id="mc-volume-slider" min="0" max="100" value="80" style="width:60px;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#45475a;outline:none;cursor:pointer;">
      <span class="mc-flat" id="mc-volume" title="静音" style="cursor:pointer;"><span id="mc-vol-icon">◉</span> <span class="mc-label" id="mc-vol-label">音量</span></span>
    </div>
    <div class="music-list" id="mc-list"></div>
    <div class="music-add">
      <input type="text" id="mc-name" placeholder="歌曲名称（可选）" style="width:120px;flex-shrink:0;">
      <input type="text" id="mc-url" placeholder="粘贴音频链接… mp3 / m4a / ogg" style="flex:1;">
      <button id="mc-add">+ 添加</button>
      <button id="mc-file" title="选择本地音频文件" style="padding:6px 10px;border:1px solid #45475a;border-radius:6px;background:#313244;color:#cdd6f4;font-size:12px;cursor:pointer;">📁 文件</button>
      <input type="file" id="mc-file-input" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple style="display:none;">
    </div>
  </div>
</div>

<!-- ===== Pinball按钮 ===== -->
<div id="pinball-btn">
  <span class="pb-icon">●</span>
  <span class="pb-label">弹珠模式</span>
</div>

<!-- ===== 转场遮罩 ===== -->
<div id="transition-overlay"></div>

<script src="pinball.js"></script>
</body>
</html>
